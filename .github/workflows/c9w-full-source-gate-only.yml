          test -s "$tmp/ra.json" || {
            echo OP4B2A_NO_RECEIPT
            "$nodebin" -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");console.log(JSON.stringify({diagnostic:"OP4B2A_SETUP_FAILURE",safe:[...new Set((s.match(/(?:OP4B2_[A-Z_]+|ERR_ASSERTION|SyntaxError|ReferenceError|TypeError)/g)||[]))],frames:[...new Set([...s.matchAll(/(?:operational_receipt_source|test_operational_receipt)\.cjs:\d+:\d+/g)].map(x=>x[0]))]}));' "$tmp/ra.err"
            exit 1
