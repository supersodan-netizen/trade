name: TRADE RC2 RS2C2a LAB
on:
  push:
    branches: ['audit/c9w-full-source-gate-only']
    paths: ['.github/workflows/c9w-full-source-gate-only.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'supersodan-netizen/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned canonical source read-only checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-source
      - name: Pinned private materialized baseline read-only checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: d4d4676c2ee420b725385f2a6deb810db9272fa9
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-lab
      - name: Pinned auditor D13 read-only checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: e561059a9bb91e1322170c2ec3848f5db0463cd4
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-auditor
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: RS2C2a and cumulative regression offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          test "$(git -C private-source rev-parse HEAD:candidate/Codigo.gs)" = c7c9d96dec84a605ff0b7ed330b3330db67c5aee
          test "$(git -C private-lab rev-parse HEAD)" = d4d4676c2ee420b725385f2a6deb810db9272fa9
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/src" "$tmp/gate" "$tmp/home" "$tmp/auditor"
          test "$(git -C private-auditor rev-parse HEAD)" = e561059a9bb91e1322170c2ec3848f5db0463cd4
          test "$(git -C private-auditor rev-parse HEAD:entregas/2026-11-24-D13/c_t9/codigo/test_c_t9.cjs)" = a4d629b441c23087a57b92d7ef993c3c3a1124d0
          test "$(git -C private-auditor rev-parse HEAD:entregas/2026-11-24-D13/c_t9/codigo/lockshm.py)" = ddf716d1069a3df7475b30c585fdc1ec72bc5385
          test "$(git -C private-auditor rev-parse HEAD:entregas/2026-11-24-D13/a_autoridad/codigo/test_d13_autoridad.cjs)" = 7b154dc41ae879dfd4ff8aaf1737b65dd3a2a668
          git -C private-auditor archive HEAD entregas/2026-11-24-D13/c_t9/codigo/test_c_t9.cjs entregas/2026-11-24-D13/c_t9/codigo/lockshm.py entregas/2026-11-24-D13/a_autoridad/codigo/test_d13_autoridad.cjs | tar -x -C "$tmp/auditor"
          python3 -I - "$tmp/auditor/entregas/2026-11-24-D13/c_t9/codigo/test_c_t9.cjs" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          a="A.init(db, { cashCents:"
          assert s.count(a)==1
          p.write_text(s.replace(a,"A.init(db, { instanceId: 'LAB-INSTANCIA-PRUEBAS', cashCents:"))
          PY
          python3 -I - "$tmp/auditor/entregas/2026-11-24-D13/a_autoridad/codigo/test_d13_autoridad.cjs" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          a="A.init(db, { ...(instanceId ?"
          assert s.count(a)==1
          p.write_text(s.replace(a,"A.init(db, { labMode: 'AUTHORITY_ONLY_FIXTURE', ...(instanceId ?"))
          PY
          git -C private-source archive HEAD candidate scripts docs tests lab | tar -x -C "$tmp/src"
          git -C private-lab archive HEAD lab/c9w-full-d11-x03 lab/c9w-full-d11-strict-q1 lab/trade-integrated-baseline | tar -x -C "$tmp/gate"
          test -z "$(find "$tmp/src" "$tmp/gate" -type f \( -name '.clasp*' -o -name '.env*' -o -name '*.pem' \) -print -quit)"
          nodebin=$(command -v node)
          base="$tmp/gate/lab/c9w-full-d11-x03"
          tools="$tmp/gate/lab/c9w-full-d11-strict-q1"
          out="$tmp/gate/lab/trade-integrated-baseline"
          offline() {
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH=/usr/bin:/bin HOME="$tmp/home" "$nodebin" "$@"
          }
          sha256sum "$out/authority_c9w_tx1_d10.cjs" | awk '{print "RC1_AUTHORITY_SHA256=" $1}'
          rsrc=0
          offline "$out/test_recovery_scan.cjs" --rs2c2a >"$tmp/rs1.json" 2>"$tmp/rs1.err" || rsrc=$?
          test -s "$tmp/rs1.json" || { echo RS1_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:r.scope,pass:r.pass,fail:r.fail,failed:r.rows.filter(x=>!x.pass).map(x=>({id:x.id,code:x.errorCode})),W:r.W}));a.equal(r.scope,"RC2_RS2C2A_BOUND_PROJECTION_LAB");a.equal(r.rows.length,125);a.equal(new Set(r.rows.map(x=>x.id)).size,125);a.equal(r.pass,125);a.equal(r.fail,0);a.ok(r.rows.every(x=>x.pass));a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/rs1.json"
          test "$rsrc" = 0
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_pb_stop.cjs)" = 3d5291877e97099568757d07dab6e59caede1730
          pbc=0
          offline "$out/test_pb_stop.cjs" "$out" pb "$tmp/pb.json" >"$tmp/pb.out" 2>"$tmp/pb.err" || pbc=$?
          test -s "$tmp/pb.json" || { echo PB_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs"),r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:"D13_PB_STOP_SENTINEL_ADAPTED_LAB",pass:r.pass,total:r.total,rows:r.filas.map(x=>({id:x.id,pass:x.pass,esperado:x.esperado,observado:x.observado,codigo:/^[A-Z0-9_]+$/.test(x.codigo||"")?x.codigo:null}))}));a.equal(r.modo,"pb");a.equal(r.total,13);a.equal(r.pass,13);a.equal(new Set(r.filas.map(x=>x.id)).size,13);a.ok(r.filas.every(x=>x.pass));' "$tmp/pb.json"
          test "$pbc" = 0
          q2rc=0
          offline "$out/test_q2.cjs" >"$tmp/q2.json" 2>"$tmp/q2.err" || q2rc=$?
          test -s "$tmp/q2.json" || { echo Q2_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:r.scope,pass:r.pass,fail:r.fail,failed:r.rows.filter(x=>!x.pass).map(x=>({id:x.id,code:x.errorCode})),W:r.W}));a.equal(r.scope,"RC1_Q2_ED25519_LAB");a.equal(r.rows.length,19);a.equal(r.pass,19);a.equal(r.fail,0);a.ok(r.rows.every(x=>x.pass));a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/q2.json"
          test "$q2rc" = 0
          for f in "$out"/*.cjs; do "$nodebin" --check "$f" >/dev/null 2>&1 || { echo Q1_SYNTAX_FAILED; exit 1; }; done
          qrc=0
          offline "$out/test_q1.cjs" "$out" "$base" >"$tmp/q1.json" 2>"$tmp/q1.err" || qrc=$?
          test -s "$tmp/q1.json" || { echo Q1_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));a.equal(r.scope,"D11_Q1_REGRESSION_Q2_LAB");a.equal(r.rows.length,9);console.log(JSON.stringify({scope:r.scope,pass:r.pass,fail:r.fail,rows:r.rows.map((x,i)=>({case:i+1,pass:x.pass,code:/^[A-Z0-9_]+$/.test(x.errorCode||"")?x.errorCode:null})),W:r.W}));a.equal(r.pass,9);a.equal(r.fail,0);a.ok(r.rows.every(x=>x.pass));a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.quoteCustodyImplemented,true);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/q1.json"
          test "$qrc" = 0
          prc=0
          offline "$out/test_tx2b_projection.cjs" >"$tmp/proj.json" 2>"$tmp/proj.err" || prc=$?
          test -s "$tmp/proj.json" || { echo Q1_PROJECTION_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));a.equal(r.scope,"TX2C_D11_X03_SOURCE_GATE_LAB");a.equal(r.rows.length,49);a.equal(new Set(r.rows.map(x=>x.id)).size,49);console.log(JSON.stringify({scope:r.scope,pass:r.pass,fail:r.fail,failed:r.rows.filter(x=>!x.pass).map(x=>({id:x.id,code:/^[A-Z0-9_]+$/.test(x.errorCode||"")?x.errorCode:null})),W:r.W}));a.equal(r.pass,49);a.equal(r.fail,0);a.ok(r.rows.every(x=>x.pass));a.equal(r.physicalWrites,0);a.equal(r.physicalClear,false);a.equal(r.certifiesP0,0);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/proj.json"
          test "$prc" = 0
          arc=0
          offline "$out/tx2b_authentic_with_projection.cjs" "$tmp/src" >"$tmp/auth.json" 2>"$tmp/auth.err" || arc=$?
          test -s "$tmp/auth.json" || { echo Q1_AUTHENTIC_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));a.equal(r.scope,"TX2B_AUTHENTIC_BUY_PLUS_SYNTHETIC_PROJECTION_LAB");a.equal(r.parentSha256,"f0b0da6f5a7dbac4ae57ee2ecb181a5b59324edff2407fe8f4af40ea52a765ab");a.equal(r.overlaySha256,"e709a5ae4d986b960e97925f4f75625faf312f734e1ee39883d9bb0f0dc8ffe1");a.equal(r.rows.length,12);console.log(JSON.stringify({scope:r.scope,pass:r.rows.filter(x=>x.pass).length,failed:r.rows.filter(x=>!x.pass).map(x=>x.mode),W:r.W}));a.ok(r.rows.every(x=>x.pass));a.ok(r.rows.slice(0,2).every(x=>x.projected===true&&x.projectionProof===true&&x.projectionClearReady===true&&x.projectionPhysicalClear===false&&x.projectionRows===4));a.ok(r.rows.slice(2).every(x=>x.projected===false));a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.projectionCompletePhysical,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/auth.json"
          test "$arc" = 0
          rrc=0
          offline "$out/test_d12_r16_r19.cjs" "$out" >"$tmp/r16.json" 2>"$tmp/r16.err" || rrc=$?
          test -s "$tmp/r16.json" || { echo R16_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs"),r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:"D12_R16_R19",pass:r.filter(x=>x.pass).length,rows:r.map(x=>({id:x.id,pass:x.pass,errorCode:x.errorCode}))}));a.equal(r.length,4);a.ok(r.every(x=>x.pass));' "$tmp/r16.json"
          test "$rrc" = 0
          sha256sum "$out/tx2b_projection_lab.cjs" | awk '{print "RC2_PROJECTOR_SHA256=" $1}'
          trc=0
          offline "$out/test_d12_t9.cjs" "$out" corregido "$tmp/t9.json" >"$tmp/t9.out" 2>"$tmp/t9.err" || trc=$?
          test -s "$tmp/t9.json" || { echo T9_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs"),r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:"D12_T9_RC2",pass:r.pass,total:r.total,rows:r.filas.map(x=>({id:x.id,pass:x.pass,esperado:x.esperado,observado:x.observado}))}));a.equal(r.total,17);a.equal(r.pass,17);a.ok(r.filas.every(x=>x.pass));' "$tmp/t9.json"
          test "$trc" = 0
          crc=0
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH=/usr/bin:/bin HOME="$tmp/home" D13C_SOLO=E1,E2,E3,E4,P6_01,P6_02,O1 "$nodebin" "$tmp/auditor/entregas/2026-11-24-D13/c_t9/codigo/test_c_t9.cjs" "$out" corregido "$tmp/c13.json" >"$tmp/c13.out" 2>"$tmp/c13.err" || crc=$?
          test -s "$tmp/c13.json" || { echo D13C_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs"),r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:"D13_C_PC_REACHABLE_AFTER_RC3",pass:r.pass,total:r.total,rows:r.filas.map(x=>({id:x.id,pass:x.pass,esperado:x.esperado,observado:x.observado,errcode:x.evidencia?.llamada?.sqlite?.errcode??x.evidencia?.llamada?.errcode??null}))}));a.equal(r.modo,"corregido");a.equal(r.total,7);a.equal(r.pass,7);a.equal(new Set(r.filas.map(x=>x.id)).size,7);a.ok(r.filas.every(x=>!/^P6_0[34]/.test(x.id)));a.ok(r.filas.every(x=>x.pass));' "$tmp/c13.json"
          test "$crc" = 0
          pac=0
          offline "$tmp/auditor/entregas/2026-11-24-D13/a_autoridad/codigo/test_d13_autoridad.cjs" "$out" pa "$tmp/pa.json" >"$tmp/pa.out" 2>"$tmp/pa.err" || pac=$?
          test -s "$tmp/pa.json" || { echo D13PA_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs"),r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:"D13_PA_AUTHORITY",pass:r.pass,total:r.total,rows:r.filas.map(x=>({id:x.id,pass:x.pass,esperado:x.esperado,observado:x.observado}))}));a.equal(r.modo,"pa");a.equal(r.total,17);a.equal(r.pass,17);a.equal(new Set(r.filas.map(x=>x.id)).size,17);a.ok(r.filas.every(x=>x.pass));' "$tmp/pa.json"
          test "$pac" = 0
          echo RC2_RS2C2A_125_PLUS_13_PLUS_110_PLUS_7_PLUS_17_LAB_NO_W_NO_GAS_NO_DEPLOY
