name: TRADE D10 independent conformance LAB only
on:
  push:
    branches: ['audit/c9w-full-source-gate-only']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'supersodan-netizen/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned D10 private sparse test branch
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: f17b301327548be6532e6895f7adbced4c1e16f3
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-review
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Isolated read-only D10 derivation and conformance with sanitized allowlisted receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-review rev-parse HEAD)" = f17b301327548be6532e6895f7adbced4c1e16f3
          test "$(git -C private-review rev-parse HEAD:codigo/authority_c9w_tx1_d10.cjs)" = 29dd76266fe88222ded456b571b3dfc6f8b91966
          test "$(git -C private-review rev-parse HEAD:base/authority_c9w_tx1_lab.cjs)" = 9cc7ce911fd5a2c1aec9a901dc77ba8af8d7347b
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/src" "$tmp/out" "$tmp/home"
          git -C private-review archive HEAD codigo pruebas base | tar -x -C "$tmp/src"
          test -z "$(find "$tmp/src" -type f \( -name '.clasp*' -o -name '.env*' -o -name '*.pem' \) -print -quit)"
          cd "$tmp/src"
          test "$(sha256sum codigo/authority_c9w_tx1_d10.cjs | cut -d ' ' -f1)" = 286807454b8b1016b680c27443b511b9fe629a44058c9f609376d921c7aef468
          test "$(sha256sum base/authority_c9w_tx1_lab.cjs | cut -d ' ' -f1)" = c3ae69fceaf16c9d945712945f92185045c66fe696b0deaf7f62bf9024bf316c
          python3 -I codigo/build_d10.py "$PWD/base/authority_c9w_tx1_lab.cjs" "$tmp/out/rebuilt.cjs" >"$tmp/out/build.log" 2>&1
          cmp -s "$tmp/out/rebuilt.cjs" codigo/authority_c9w_tx1_d10.cjs
          echo D10_SHA256_AND_BYTE_EXACT_REBUILD_VERIFIED
          nodebin=$(command -v node)
          "$nodebin" -v
          chmod 777 "$tmp/out"
          runcase() {
            local n="$1"; shift
            local rc=0
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH=/usr/bin:/bin HOME="$tmp/home" C9W_BASE="$tmp/src/base" "$nodebin" "$@" > "$tmp/out/$n.stdout" 2>"$tmp/out/$n.stderr" || rc=$?
            printf '%s\n' "$rc" > "$tmp/out/$n.exit"
          }
          runcase recover pruebas/recuperacion/test_d10_recovery.cjs codigo/authority_c9w_tx1_d10.cjs --json "$tmp/out/recover.json"
          runcase sensitivity pruebas/recuperacion/sensibilidad_d10.cjs codigo/authority_c9w_tx1_d10.cjs --json "$tmp/out/sensitivity.json"
          runcase d10 pruebas/conformidad_v2/cj2_conformidad.cjs pruebas/conformidad_v2/adaptador_D10.cjs --json "$tmp/out/d10.json"
          runcase baseline pruebas/conformidad_v2/cj2_conformidad.cjs pruebas/conformidad_v2/adaptador_D9B.cjs --json "$tmp/out/baseline.json"
          runcase deny pruebas/conformidad_v2/cj2_conformidad.cjs pruebas/conformidad_v2/adaptador_DENY.cjs --esperar-cero-pass --json "$tmp/out/deny.json"
          "$nodebin" -e '
            const a=require("node:assert/strict"), fs=require("node:fs"), p=process.argv[1];
            const rd=n=>JSON.parse(fs.readFileSync(p+"/"+n+".json","utf8"));
            const ex=n=>Number(fs.readFileSync(p+"/"+n+".exit","utf8").trim());
            const recovered=rd("recover"), sensitivity=rd("sensitivity"), d10=rd("d10"), baseline=rd("baseline"), deny=rd("deny");
            a.equal(ex("recover"),0);a.equal(recovered.totales.PASS,32);a.ok(recovered.pruebas.every(x=>x.resultado==="PASS"));
            a.equal(ex("sensitivity"),0);a.equal(sensitivity.total,19);a.equal(sensitivity.detectados,19);a.ok(sensitivity.mutantes.every(x=>x.detectado===true));
            a.equal(ex("d10"),1);a.deepEqual(d10.totales,{PASS:34,NO_SOPORTADO:6});
            a.equal(ex("baseline"),1);a.deepEqual(baseline.totales,{PASS:18,FAIL:7,NO_SOPORTADO:15});
            a.equal(ex("deny"),0);a.equal(deny.totales.PASS||0,0);a.equal(deny.totales.FAIL,39);a.equal(deny.totales.NO_SOPORTADO,1);
            console.log(JSON.stringify({scope:"INDEPENDENT_D10_LAB_REPRODUCED",sourceSha256:"286807454b8b1016b680c27443b511b9fe629a44058c9f609376d921c7aef468",byteExactRebuild:true,recoveryPass:32,recoveryFail:0,mutantsDetected:19,mutantsTotal:19,conformanceD10:d10.totales,conformanceD9Baseline:baseline.totales,negativeControlDeny:deny.totales,physicalWrites:0,certifiesP0:0,stagingPrivate:true,W:"HOLD_EXTERNAL_EVIDENCE"}));
          ' "$tmp/out"
          echo D10_NO_GAS_NO_W_NO_BROKER_NO_DEPLOY