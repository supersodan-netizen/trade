          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs"),r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify(r));a.equal(r.scope,"OP4B2A_AUTHENTICATED_RECEIPT_SOURCE_LAB");a.equal(r.total,35);a.equal(r.pass,35);a.equal(r.rows.length,35);a.equal(new Set(r.rows.map(x=>x.id)).size,35);a.ok(r.rows.every(x=>x.pass));a.equal(r.manifest.parentSourceSha256,"8f1ec807c6bb2ffab63aac6d6f36c02edb9b9cff7c36c5f8764037ae3fcac348");a.equal(r.manifest.rollbackByteExact,true);a.equal(r.manifest.physicalWrites,0);a.equal(r.manifest.certifiesP0,0);a.equal(r.manifest.transportInstalled,false);a.equal(r.manifest.deployable,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/ra.json"
          test "$ra" = 0
          echo OP4B2A_35_PLUS_144_TARGETED_LAB_NO_W_NO_GAS_NO_DEPLOY
