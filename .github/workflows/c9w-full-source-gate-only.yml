name: TRADE OP4b2a authenticated receipt source LAB
on:
  push:
    branches: ['audit/c9w-full-source-gate-only']
    paths: ['.github/workflows/c9w-full-source-gate-only.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'supersodan-netizen/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned canonical source read-only checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-source
      - name: Pinned private materialized baseline read-only checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 1fd5b99f928366d078552e002b67efc4633b86b5
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-lab
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: OP4b2a receipt authentication and targeted regressions offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          test "$(git -C private-source rev-parse HEAD:candidate/Codigo.gs)" = c7c9d96dec84a605ff0b7ed330b3330db67c5aee
          test "$(git -C private-lab rev-parse HEAD)" = 1fd5b99f928366d078552e002b67efc4633b86b5
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/authority_c9w_tx1_d10.cjs)" = 901d8a294181b7c3ab3c455a208c411cab9c16fc
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/tx2b_projection_lab.cjs)" = 072314c266060fae7a3442eb12e1f1792a81c1ec
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_recovery_source.cjs)" = a0cff670b27567d1558794114e06506e79d9b83e
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_recovery.cjs)" = d8a76904d8b73202663847da7468e8c75bf6d5ce
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_buy_source.cjs)" = bb753f755868c7c1610a4e9f18bc111b8663f177
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/tx2b_authentic_with_projection.cjs)" = aa1644aaf9dbbdf579b4bca51d61a1c63320bc6c
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_stop_source.cjs)" = 6f6fde50fcf7507c64131f3a5de18527ced1b3d0
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_stop.cjs)" = 96d4b6b2197370ecdb8904a705c8889c2e6a3c07
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_pb_stop.cjs)" = 3d5291877e97099568757d07dab6e59caede1730
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_cash_source.cjs)" = c0c15470a3360723866b21ea6cd133b81d1d4257
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/q2_fixture_lab.cjs)" = e54a79779c726765b550cbfd53cda8162a418e7e
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_d12_r16_r19.cjs)" = c8fc580a987e6ec5e03acd4e8a35512922cf7c97
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_d12_t9.cjs)" = eb196904a8d1e38e5131a10cf94fd39c6e87baf3
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_cash.cjs)" = c2f7b1efc1ecff7d4b3cafabb9a77081a249f9f3
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_stop_admission.cjs)" = 28d496cf75a06fd79814735ac4ae43e5b6d8b303
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_q1.cjs)" = e86bf304ef0f94f222b0e0f42370a32cc2d7b700
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_q2.cjs)" = e2ac7b1ceb233ffbc9ee1c69f7dba2f0a92a727e
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_recovery_scan.cjs)" = 22488b7b86c52c49b1c9bc1df7006ca7cc3c32cb
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_rs2c3_mutants.cjs)" = f7a7e0b08afe82ff2f13c0804a12637235177cb0
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_tx2b_projection.cjs)" = 4b4118d7b726d6adca83ced3770be594205d45d6
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_reconciliation_source.cjs)" = 5279c2f2ba0ec4d52c25f401b1206a817c57e50e
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_reconciliation.cjs)" = 7de01239271c6c0678583fa69df599965bc20db7
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_receipt_source.cjs)" = 2f93b803cc0c0125e4b1960a3e39a8a812a7c3a6
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_receipt.cjs)" = 87feda21b395a80252ad7d569f1f3eb769fa8d43
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/src" "$tmp/gate" "$tmp/home"
          git -C private-source archive HEAD candidate scripts docs tests lab | tar -x -C "$tmp/src"
          git -C private-lab archive HEAD lab/trade-integrated-baseline | tar -x -C "$tmp/gate"
          test -z "$(find "$tmp/src" "$tmp/gate" -type f \( -name '.clasp*' -o -name '.env*' -o -name '*.pem' \) -print -quit)"
          nodebin=$(command -v node)
          out="$tmp/gate/lab/trade-integrated-baseline"
          offline() {
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH=/usr/bin:/bin HOME="$tmp/home" "$nodebin" "$@"
          }
          ca=0
          offline "$out/test_operational_cash.cjs" "$tmp/src" >"$tmp/cash.json" 2>"$tmp/cash.err" || ca=$?
          test -s "$tmp/cash.json" || {
            echo OP4A_NO_RECEIPT
            "$nodebin" -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");console.log(JSON.stringify({diagnostic:"OP4A_SETUP_FAILURE",safe:[...new Set((s.match(/(?:OP4_[A-Z_]+|ERR_ASSERTION|SyntaxError|ReferenceError|TypeError)/g)||[]))],frames:[...new Set([...s.matchAll(/(?:operational_cash_source|test_operational_cash)\.cjs:\d+:\d+/g)].map(x=>x[0]))]}));' "$tmp/cash.err"
            exit 1
          }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs"),r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify(r));a.equal(r.scope,"OP4A_EFFECTIVE_CASH_SOURCE_LAB");a.equal(r.total,19);a.equal(r.pass,19);a.equal(new Set(r.rows.map(x=>x.id)).size,19);a.ok(r.rows.every(x=>x.pass));a.equal(r.manifest.parentSourceSha256,"a5212b19b079386063d27c2e0378186a68d41d17c413212fc85141fc3d5a0e0f");a.equal(r.manifest.rollbackByteExact,true);a.equal(r.manifest.physicalWrites,0);a.equal(r.manifest.certifiesP0,0);a.equal(r.manifest.deployable,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/cash.json"
          test "$ca" = 0
          sb=0
          offline "$out/test_operational_stop_admission.cjs" >"$tmp/sb.json" 2>"$tmp/sb.err" || sb=$?
          test -s "$tmp/sb.json" || { echo OP3B_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:r.scope,pass:r.pass,total:r.total,rows:r.rows.map(x=>({id:x.id,pass:x.pass,errorCode:x.errorCode,detail:x.detail}))}));a.equal(r.scope,"OP3B_STOP_ADMISSION_LAB");a.equal(r.total,14);a.equal(r.pass,14);a.equal(r.rows.length,14);a.equal(new Set(r.rows.map(x=>x.id)).size,14);a.ok(r.rows.every(x=>x.pass));a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/sb.json"
          test "$sb" = 0
          orc=0
          offline "$out/test_operational_recovery.cjs" "$tmp/src" >"$tmp/op.json" 2>"$tmp/op.err" || orc=$?
          test -s "$tmp/op.json" || { echo OP1_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify(r));a.equal(r.scope,"OP1_OPERATIONAL_RECOVERY_SOURCE_LAB");a.equal(r.rows.length,12);a.equal(new Set(r.rows.map(x=>x.id)).size,12);a.equal(r.pass,12);a.equal(r.fail,0);a.ok(r.rows.every(x=>x.pass));a.equal(r.manifest.parentSourceSha256,"f0b0da6f5a7dbac4ae57ee2ecb181a5b59324edff2407fe8f4af40ea52a765ab");a.equal(r.manifest.rollbackByteExact,true);a.equal(r.manifest.physicalWrites,0);a.equal(r.manifest.certifiesP0,0);a.equal(r.manifest.transportInstalled,false);a.equal(r.manifest.deployable,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/op.json"
          test "$orc" = 0
          arc=0
          offline "$out/tx2b_authentic_with_projection.cjs" "$tmp/src" >"$tmp/auth.json" 2>"$tmp/auth.err" || arc=$?
          test -s "$tmp/auth.json" || { echo OP1_BUY_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));a.equal(r.scope,"TX2B_AUTHENTIC_BUY_PLUS_SYNTHETIC_PROJECTION_LAB");a.equal(r.parentSha256,"f0b0da6f5a7dbac4ae57ee2ecb181a5b59324edff2407fe8f4af40ea52a765ab");a.equal(r.overlaySha256,"e709a5ae4d986b960e97925f4f75625faf312f734e1ee39883d9bb0f0dc8ffe1");a.equal(r.rows.length,12);console.log(JSON.stringify({scope:r.scope,pass:r.rows.filter(x=>x.pass).length,failed:r.rows.filter(x=>!x.pass).map(x=>x.mode),W:r.W}));a.ok(r.rows.every(x=>x.pass));a.ok(r.rows.slice(0,2).every(x=>x.projected===true&&x.projectionProof===true&&x.projectionClearReady===true&&x.projectionPhysicalClear===false&&x.projectionRows===4));a.ok(r.rows.slice(2).every(x=>x.projected===false));a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.projectionCompletePhysical,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/auth.json"
          test "$arc" = 0
          brc=0
          offline "$out/tx2b_authentic_with_projection.cjs" "$tmp/src" --op2 >"$tmp/buy.json" 2>"$tmp/buy.err" || brc=$?
          test -s "$tmp/buy.json" || {
            echo OP2_NO_RECEIPT
            "$nodebin" -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");const safe=[...new Set((s.match(/(?:OP2_[A-Z_]+|ERR_ASSERTION|SyntaxError|ReferenceError|TypeError|ERR_SQLITE_ERROR)/g)||[]))];const frames=[...s.matchAll(/(?:operational_buy_source|tx2b_authentic_with_projection|operational_recovery_source)\.cjs:\d+:\d+/g)].map(x=>x[0]);console.log(JSON.stringify({diagnostic:"OP2_SETUP_FAILURE",safe,frames:[...new Set(frames)]}));' "$tmp/buy.err"
            exit 1
          }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:r.scope,manifest:r.manifest,pass:r.rows.filter(x=>x.pass).length,total:r.rows.length,failed:r.rows.filter(x=>!x.pass).map(x=>({mode:x.mode,raw:x.raw,port:x.port,prepare:x.prepare,commit:x.commit,reads:x.readbacks,queueReads:x.queueReads,commits:x.commits,receiptClass:x.receiptClass,secondClass:x.secondClass,exception:x.exception,reason:x.reason})),W:r.W}));a.equal(r.scope,"OP2_OPERATIONAL_BUY_SOURCE_LAB");a.equal(r.parentSha256,"1a53990ba686649cc50de6c8bc1565b87696d0edfaa604f3d4b5770819783d72");a.equal(r.rows.length,26);a.equal(new Set(r.rows.map(x=>x.mode)).size,26);a.ok(r.rows.every(x=>x.pass));a.equal(r.manifest.rollbackByteExact,true);a.equal(r.manifest.transportInstalled,false);a.equal(r.manifest.deployable,false);a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.projectionCompletePhysical,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/buy.json"
          test "$brc" = 0
          src=0
          offline "$out/test_operational_stop.cjs" "$tmp/src" >"$tmp/stop.json" 2>"$tmp/stop.err" || src=$?
          test -s "$tmp/stop.json" || {
            echo OP3_NO_RECEIPT
            "$nodebin" -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");const safe=[...new Set((s.match(/(?:OP3_[A-Z_]+|ERR_ASSERTION|SyntaxError|ReferenceError|TypeError|ERR_SQLITE_ERROR)/g)||[]))];const frames=[...s.matchAll(/(?:operational_stop_source|test_operational_stop|operational_buy_source)\.cjs:\d+:\d+/g)].map(x=>x[0]);console.log(JSON.stringify({diagnostic:"OP3_SETUP_FAILURE",safe,frames:[...new Set(frames)]}));' "$tmp/stop.err"
            exit 1
          }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify(r));a.equal(r.scope,"OP3A_OPERATIONAL_STOP_SOURCE_LAB");a.equal(r.total,18);a.equal(r.pass,18);a.equal(r.rows.length,18);a.equal(new Set(r.rows.map(x=>x.id)).size,18);a.ok(r.rows.every(x=>x.pass));a.equal(r.manifest.parentSourceSha256,"444eda47c9cd59030c40c10877e136f0a2607d923104cf5ad4421acc9ee46d83");a.equal(r.manifest.rollbackByteExact,true);a.equal(r.manifest.degradedOnly,true);a.equal(r.manifest.physicalWrites,0);a.equal(r.manifest.transportInstalled,false);a.equal(r.manifest.deployable,false);a.equal(r.manifest.certifiesP0,0);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/stop.json"
          test "$src" = 0
          prc=0
          offline "$out/test_pb_stop.cjs" "$out" pb "$tmp/pb.json" >"$tmp/pb.out" 2>"$tmp/pb.err" || prc=$?
          test -s "$tmp/pb.json" || { echo OP3_PB_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:"D13_PB_STOP_SENTINEL_LAB",pass:r.pass,total:r.total,failed:r.filas.filter(x=>!x.pass).map(x=>x.id)}));a.equal(r.modo,"pb");a.equal(r.pass,13);a.equal(r.total,13);a.ok(r.filas.every(x=>x.pass));a.equal(r.modulo.autoridad,"f3895a4d40bf077b07453b2202a0c5b077d9765d1ffcb642de468ed42e8725b2");' "$tmp/pb.json"
          test "$prc" = 0
          rb=0
          offline "$out/test_operational_reconciliation.cjs" "$tmp/src" >"$tmp/rb.json" 2>"$tmp/rb.err" || rb=$?
          test -s "$tmp/rb.json" || {
            echo OP4B_NO_RECEIPT
            "$nodebin" -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");console.log(JSON.stringify({diagnostic:"OP4B_SETUP_FAILURE",safe:[...new Set((s.match(/(?:OP4B_[A-Z_]+|ERR_ASSERTION|SyntaxError|ReferenceError|TypeError)/g)||[]))],frames:[...new Set([...s.matchAll(/(?:operational_reconciliation_source|test_operational_reconciliation)\.cjs:\d+:\d+/g)].map(x=>x[0]))]}));' "$tmp/rb.err"
            exit 1
          }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs"),r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify(r));a.equal(r.scope,"OP4B_RECONCILIATION_SOURCE_LAB");a.equal(r.total,30);a.equal(r.pass,30);a.equal(r.rows.length,30);a.equal(new Set(r.rows.map(x=>x.id)).size,30);a.ok(r.rows.every(x=>x.pass));a.equal(r.manifest.parentSourceSha256,"cfa3b6a098cd2048e464984e8c9739f5f1118bace3e580a5e2bd41e1e352edb0");a.equal(r.manifest.rollbackByteExact,true);a.equal(r.manifest.physicalWrites,0);a.equal(r.manifest.certifiesP0,0);a.equal(r.manifest.transportInstalled,false);a.equal(r.manifest.deployable,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/rb.json"
