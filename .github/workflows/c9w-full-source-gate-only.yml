name: TRADE D11 pinned delivery verification LAB only
on:
  push:
    branches: ['audit/c9w-full-source-gate-only']
    paths: ['.github/workflows/c9w-full-source-gate-only.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'supersodan-netizen/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned private delivery checkout (read-only)
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 674ac0720006c43ea6540c1a2bc7c43b39bba0f8
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-delivery
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify manifest and reproduce four builds and focal suites offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-delivery rev-parse HEAD)" = 674ac0720006c43ea6540c1a2bc7c43b39bba0f8
          test "$(git -C private-delivery rev-parse HEAD:entregas/2026-11-21-D11/MANIFEST.json)" = c46b990056fa4cf480df28c66676ca9d535088a5
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/src" "$tmp/home"
          git -C private-delivery archive HEAD entregas/2026-11-21-D11 | tar -x -C "$tmp/src"
          cd "$tmp/src/entregas/2026-11-21-D11"
          node -e 'const a=require("node:assert/strict"),f=require("node:fs"),p=require("node:path"),c=require("node:crypto");const m=JSON.parse(f.readFileSync("MANIFEST.json"));a.equal(m.files.length,42);a.equal(new Set(m.files.map(x=>x.path)).size,42);for(const x of m.files){a.ok(!p.isAbsolute(x.path)&&!x.path.split("/").includes(".."));const s=f.lstatSync(x.path);a.ok(s.isFile());const b=f.readFileSync(x.path);a.equal(b.length,x.bytes);a.equal(c.createHash("sha256").update(b).digest("hex"),x.sha256)}console.log("D11_MANIFEST_SHA256_AND_BYTES_42_OF_42")' >"$tmp/manifest.log" 2>"$tmp/manifest.err" || { echo D11_MANIFEST_FAILED; exit 1; }
          cat "$tmp/manifest.log"
          nodebin=$(command -v node)
          "$nodebin" -v
          # No secrets, network, deploy credentials, operational data or source logs in test subprocesses.
          offline() {
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH=/usr/bin:/bin HOME="$tmp/home" "$nodebin" "$@"
          }
          for variant in lab papersim produccion; do
            args=()
            suffix=""
            if [ "$variant" = papersim ]; then args=(--entorno PAPER-SIM); suffix=_papersim; fi
            if [ "$variant" = produccion ]; then args=(--produccion); suffix=_produccion; fi
            offline codigo/build_d11.cjs codigo/authority_c9w_tx1_d10.cjs "${args[@]}" --salida "$tmp/build.cjs" >"$tmp/build.log" 2>"$tmp/build.err" || { echo D11_BUILD_FAILED; exit 1; }
            cmp -s "$tmp/build.cjs" "codigo/authority_c9w_tx1_d11${suffix}.cjs" || { echo D11_BUILD_BYTES_MISMATCH; exit 1; }
            echo "D11_BUILD_IDENTICAL_$variant"
          done
          offline codigo/build_tx2b_d11.cjs codigo/tx2b_projection_lab_equipo.cjs "$tmp/projection.cjs" >"$tmp/p.log" 2>"$tmp/p.err" || { echo D11_PROJECTION_BUILD_FAILED; exit 1; }
          cmp -s "$tmp/projection.cjs" codigo/tx2b_projection_lab_d11.cjs || { echo D11_PROJECTION_BUILD_MISMATCH; exit 1; }
          echo D11_PROJECTION_BUILD_IDENTICAL
          offline pruebas/recuperacion/test_d10_recovery.cjs codigo/authority_c9w_tx1_d10.cjs --json "$tmp/recovery.json" >"$tmp/r.log" 2>"$tmp/r.err" || { echo D11_RECOVERY_FAILED; exit 1; }
          offline pruebas/estricto/test_d11_estricto.cjs --json "$tmp/strict.json" >"$tmp/s.log" 2>"$tmp/s.err" || { echo D11_STRICT_FAILED; exit 1; }
          offline pruebas/recuperacion/barrido_oraculos.cjs codigo/authority_c9w_tx1_d10.cjs --test pruebas/recuperacion/test_d10_recovery.cjs --json "$tmp/oracles.json" >"$tmp/o.log" 2>"$tmp/o.err" || { echo D11_ORACLES_FAILED; exit 1; }
          offline pruebas/recuperacion/sensibilidad_d10.cjs codigo/authority_c9w_tx1_d10.cjs --json "$tmp/m10.json" >"$tmp/m10.log" 2>"$tmp/m10.err" || { echo D11_D10_MUTANTS_FAILED; exit 1; }
          offline pruebas/estricto/sensibilidad_d11.cjs codigo/authority_c9w_tx1_d11.cjs --json "$tmp/m11.json" >"$tmp/m11.log" 2>"$tmp/m11.err" || { echo D11_STRICT_MUTANTS_FAILED; exit 1; }
          node -e 'const a=require("node:assert/strict"),f=require("node:fs"),d=process.argv[1],r=n=>JSON.parse(f.readFileSync(d+"/"+n+".json"));for(const [n,t] of [["recovery",32],["strict",15]]){const x=r(n);a.equal(x.totales.PASS,t);a.equal(Object.values(x.totales).reduce((s,v)=>s+v,0),t);console.log("D11_"+n.toUpperCase()+"_"+t+"_OF_"+t)}for(const [n,t] of [["m10",19],["m11",18]]){const x=r(n);a.equal(x.detectados,t);a.equal(x.total,t);console.log("D11_"+n.toUpperCase()+"_"+t+"_OF_"+t)}const o=r("oracles");a.ok(o.mutantes.find(m=>m.mutante.startsWith("S5")).pruebasQueFallan.includes("R01"));const deny=o.mutantes.find(m=>m.mutante.startsWith("DENY_TOTAL"));a.ok(deny);a.equal(deny.pruebasQuePasanConDENY.length,0);a.equal(o.estatico.length,0);console.log("D11_R01_CAUSAL_AND_DENY_TOTAL_ZERO_PASS")' "$tmp" >"$tmp/gate.log" 2>"$tmp/gate.err" || { echo D11_RECEIPT_GATE_FAILED; exit 1; }
          cat "$tmp/gate.log"
          echo D11_REPRODUCTION_LAB_ONLY_NO_GAS_NO_W_NO_DEPLOY
