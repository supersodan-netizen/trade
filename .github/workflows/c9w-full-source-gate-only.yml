name: TRADE OP2 source integration LAB
on:
  push:
    branches: ['audit/c9w-full-source-gate-only']
    paths: ['.github/workflows/c9w-full-source-gate-only.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'supersodan-netizen/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned canonical source read-only checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-source
      - name: Pinned private materialized baseline read-only checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 03cf61057579c5af874e6503f01b3db12803443e
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-lab
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: OP2 source and targeted OP1 BUY regressions offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          test "$(git -C private-source rev-parse HEAD:candidate/Codigo.gs)" = c7c9d96dec84a605ff0b7ed330b3330db67c5aee
          test "$(git -C private-lab rev-parse HEAD)" = 03cf61057579c5af874e6503f01b3db12803443e
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/authority_c9w_tx1_d10.cjs)" = e279d6bf654cb69a8a3320cee9d7e0f36ccef559
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/tx2b_projection_lab.cjs)" = 072314c266060fae7a3442eb12e1f1792a81c1ec
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_recovery_source.cjs)" = a0cff670b27567d1558794114e06506e79d9b83e
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_recovery.cjs)" = d8a76904d8b73202663847da7468e8c75bf6d5ce
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_buy_source.cjs)" = bb753f755868c7c1610a4e9f18bc111b8663f177
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/tx2b_authentic_with_projection.cjs)" = aa1644aaf9dbbdf579b4bca51d61a1c63320bc6c
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/src" "$tmp/gate" "$tmp/home"
          git -C private-source archive HEAD candidate scripts docs tests lab | tar -x -C "$tmp/src"
          git -C private-lab archive HEAD lab/trade-integrated-baseline | tar -x -C "$tmp/gate"
          test -z "$(find "$tmp/src" "$tmp/gate" -type f \( -name '.clasp*' -o -name '.env*' -o -name '*.pem' \) -print -quit)"
          nodebin=$(command -v node)
          out="$tmp/gate/lab/trade-integrated-baseline"
          offline() {
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH=/usr/bin:/bin HOME="$tmp/home" "$nodebin" "$@"
          }
          orc=0
          offline "$out/test_operational_recovery.cjs" "$tmp/src" >"$tmp/op.json" 2>"$tmp/op.err" || orc=$?
          test -s "$tmp/op.json" || { echo OP1_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify(r));a.equal(r.scope,"OP1_OPERATIONAL_RECOVERY_SOURCE_LAB");a.equal(r.rows.length,12);a.equal(new Set(r.rows.map(x=>x.id)).size,12);a.equal(r.pass,12);a.equal(r.fail,0);a.ok(r.rows.every(x=>x.pass));a.equal(r.manifest.parentSourceSha256,"f0b0da6f5a7dbac4ae57ee2ecb181a5b59324edff2407fe8f4af40ea52a765ab");a.equal(r.manifest.rollbackByteExact,true);a.equal(r.manifest.physicalWrites,0);a.equal(r.manifest.certifiesP0,0);a.equal(r.manifest.transportInstalled,false);a.equal(r.manifest.deployable,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/op.json"
          test "$orc" = 0
          arc=0
          offline "$out/tx2b_authentic_with_projection.cjs" "$tmp/src" >"$tmp/auth.json" 2>"$tmp/auth.err" || arc=$?
          test -s "$tmp/auth.json" || { echo OP1_BUY_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));a.equal(r.scope,"TX2B_AUTHENTIC_BUY_PLUS_SYNTHETIC_PROJECTION_LAB");a.equal(r.parentSha256,"f0b0da6f5a7dbac4ae57ee2ecb181a5b59324edff2407fe8f4af40ea52a765ab");a.equal(r.overlaySha256,"e709a5ae4d986b960e97925f4f75625faf312f734e1ee39883d9bb0f0dc8ffe1");a.equal(r.rows.length,12);console.log(JSON.stringify({scope:r.scope,pass:r.rows.filter(x=>x.pass).length,failed:r.rows.filter(x=>!x.pass).map(x=>x.mode),W:r.W}));a.ok(r.rows.every(x=>x.pass));a.ok(r.rows.slice(0,2).every(x=>x.projected===true&&x.projectionProof===true&&x.projectionClearReady===true&&x.projectionPhysicalClear===false&&x.projectionRows===4));a.ok(r.rows.slice(2).every(x=>x.projected===false));a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.projectionCompletePhysical,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/auth.json"
          test "$arc" = 0
          brc=0
          offline "$out/tx2b_authentic_with_projection.cjs" "$tmp/src" --op2 >"$tmp/buy.json" 2>"$tmp/buy.err" || brc=$?
          test -s "$tmp/buy.json" || {
            echo OP2_NO_RECEIPT
            "$nodebin" -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");const safe=[...new Set((s.match(/(?:OP2_[A-Z_]+|ERR_ASSERTION|SyntaxError|ReferenceError|TypeError|ERR_SQLITE_ERROR)/g)||[]))];const frames=[...s.matchAll(/(?:operational_buy_source|tx2b_authentic_with_projection|operational_recovery_source)\.cjs:\d+:\d+/g)].map(x=>x[0]);console.log(JSON.stringify({diagnostic:"OP2_SETUP_FAILURE",safe,frames:[...new Set(frames)]}));' "$tmp/buy.err"
            exit 1
          }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:r.scope,manifest:r.manifest,pass:r.rows.filter(x=>x.pass).length,total:r.rows.length,failed:r.rows.filter(x=>!x.pass).map(x=>({mode:x.mode,raw:x.raw,port:x.port,prepare:x.prepare,commit:x.commit,reads:x.readbacks,queueReads:x.queueReads,commits:x.commits,receiptClass:x.receiptClass,secondClass:x.secondClass,exception:x.exception,reason:x.reason})),W:r.W}));a.equal(r.scope,"OP2_OPERATIONAL_BUY_SOURCE_LAB");a.equal(r.parentSha256,"1a53990ba686649cc50de6c8bc1565b87696d0edfaa604f3d4b5770819783d72");a.equal(r.rows.length,26);a.equal(new Set(r.rows.map(x=>x.mode)).size,26);a.ok(r.rows.every(x=>x.pass));a.equal(r.manifest.rollbackByteExact,true);a.equal(r.manifest.transportInstalled,false);a.equal(r.manifest.deployable,false);a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.projectionCompletePhysical,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/buy.json"
          test "$brc" = 0
          echo OP2_26_PLUS_12_OP1_PLUS_12_BUY_TARGETED_LAB_NO_W_NO_GAS_NO_DEPLOY
