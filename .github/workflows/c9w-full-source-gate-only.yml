name: TRADE TX2B projection separate sink LAB only
on:
  push:
    branches: ['audit/c9w-full-source-gate-only']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'supersodan-netizen/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned private sparse LAB checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 4a85b009f4bd11d369dadeb380240f4fcb5c0d7d
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-lab
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Execute TX2B no-network synthetic SQLite projection tests and sanitize receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-lab rev-parse HEAD)" = 4a85b009f4bd11d369dadeb380240f4fcb5c0d7d
          test "$(git -C private-lab rev-parse HEAD:integration/authority_c9w_tx1_d10.cjs)" = 29dd76266fe88222ded456b571b3dfc6f8b91966
          test "$(git -C private-lab rev-parse HEAD:integration/tx2b_projection_lab.cjs)" = dd394640c3184144a2e1b1fca4282bbae7abe457
          test "$(git -C private-lab rev-parse HEAD:integration/test_tx2b_projection.cjs)" = 5859cc8f22ad4ab7042f5b3735b61faf7cfd2236
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/src" "$tmp/home"
          git -C private-lab archive HEAD integration | tar -x -C "$tmp/src"
          test -z "$(find "$tmp/src" -type f \( -name '.clasp*' -o -name '.env*' -o -name '*.pem' \) -print -quit)"
          test "$(sha256sum "$tmp/src/integration/tx2b_projection_lab.cjs" | cut -d ' ' -f1)" = 2d034c712ec9b4584851aeada6ca4e18464ec05ffd5e267fa9fe2fddef333709
          test "$(sha256sum "$tmp/src/integration/test_tx2b_projection.cjs" | cut -d ' ' -f1)" = da2b8cf20ae7cfa050946fbc398496d20638abc989f93aec94126ec017d73754
          nodebin=$(command -v node)
          "$nodebin" -v
          "$nodebin" --check "$tmp/src/integration/tx2b_projection_lab.cjs"
          "$nodebin" --check "$tmp/src/integration/test_tx2b_projection.cjs"
          rc=0
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH=/usr/bin:/bin HOME="$tmp/home" "$nodebin" "$tmp/src/integration/test_tx2b_projection.cjs" >"$tmp/r.json" 2>"$tmp/e" || rc=$?
          if [ ! -s "$tmp/r.json" ]; then
            echo TX2B_NO_STRUCTURED_RESULT
            exit 2
          fi
          node -e 'const a=require("node:assert/strict"),fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const expected=["P01_HAPPY_COMMIT_TO_FOUR_VIEWS_AND_READY_ONLY","P02_REPLAY_PREPARE_CLEAR_NO_DUPLICATE","P03_REFUSE_UNCOMMITTED_TX","P04_REJECT_OUT_OF_ORDER_AND_PERSIST_HOLD","P05_LOCKED_TWO_WRITERS_BUSY_WITHOUT_EXTRA_ISSUE","P06_LIQ_EXTERNAL_TAMPER_CAUSES_FORENSIC_HOLD","P07_OP_EXTERNAL_TAMPER_CAUSES_HOLD","P08_TAMPER_AFTER_VERIFY_REVOKES_CLEAR","P09_TAMPER_AFTER_READY_REVOKES_EXISTING_TOKEN","P10_REJECT_DOUBLE_BOOTSTRAP","P11_DENY_STALE_FENCING_AFTER_LEASE","P12_SOURCE_BOOK_TAMPER_DENIED","P13_NO_AUTO_RESUME_AFTER_SIGKILL_STEP1_TO4","P14_NO_AUTO_CLEAR_AFTER_SIGKILL_POST_SEAL","P15_SIGKILL_AFTER_VERIFIED_CAN_RECHECK_AND_CLEAR","P16_SIGKILL_AFTER_CLEAR_RECEIPT_IDEMPOTENT","P17_CLAIMED_STATUS_CANNOT_PREPARE"];a.equal(r.scope,"TX2B_PROJECTION_SEPARATE_SQLITE_LAB");a.equal(r.rows.length,expected.length);a.deepEqual(r.rows.map(x=>x.id),expected);console.log(JSON.stringify({scope:r.scope,pass:r.pass,fail:r.fail,rows:r.rows.map(x=>({id:x.id,pass:x.pass,code:x.pass?null:(/^(TX2B_[A-Z0-9_]+|ERR_ASSERTION|SQLITE_[A-Z0-9_]+)$/.test(x.errorCode||"")?x.errorCode:'UNKNOWN')})),physicalWrites:r.physicalWrites,physicalClear:r.physicalClear,realGAS:r.realGAS,realBroker:r.realBroker,certifiesP0:r.certifiesP0,W:r.W}));a.equal(r.fail,0);a.equal(r.pass,17);a.ok(r.rows.every(x=>x.pass));a.equal(r.physicalWrites,0);a.equal(r.physicalClear,false);a.equal(r.certifiesP0,0);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/r.json"
          test "$rc" = 0
          echo TX2B_SYNTHETIC_SEPARATE_SINK_LAB_ONLY_NO_W_NO_GAS_NO_CLEAR