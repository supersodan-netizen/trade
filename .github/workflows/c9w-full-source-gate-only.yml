name: TRADE materialized RC0 Q1 baseline verification LAB
on:
  push:
    branches: ['audit/c9w-full-source-gate-only']
    paths: ['.github/workflows/c9w-full-source-gate-only.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'supersodan-netizen/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned canonical source read-only checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-source
      - name: Pinned private materialized baseline read-only checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 21cff3cd9a7bf2b0c066200d696a08afb68571d4
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-lab
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify RC0 materialized bytes and accumulated suites offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          test "$(git -C private-source rev-parse HEAD:candidate/Codigo.gs)" = c7c9d96dec84a605ff0b7ed330b3330db67c5aee
          test "$(git -C private-lab rev-parse HEAD)" = 21cff3cd9a7bf2b0c066200d696a08afb68571d4
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/src" "$tmp/gate" "$tmp/home"
          git -C private-source archive HEAD candidate scripts docs tests lab | tar -x -C "$tmp/src"
          git -C private-lab archive HEAD lab/c9w-full-d11-x03 lab/c9w-full-d11-strict-q1 lab/trade-integrated-baseline | tar -x -C "$tmp/gate"
          test -z "$(find "$tmp/src" "$tmp/gate" -type f \( -name '.clasp*' -o -name '.env*' -o -name '*.pem' \) -print -quit)"
          nodebin=$(command -v node)
          base="$tmp/gate/lab/c9w-full-d11-x03"
          tools="$tmp/gate/lab/c9w-full-d11-strict-q1"
          out="$tmp/gate/lab/trade-integrated-baseline"
          offline() {
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH=/usr/bin:/bin HOME="$tmp/home" "$nodebin" "$@"
          }
          offline "$tools/build_q1.cjs" "$base" "$tmp/rebuilt" >"$tmp/build.json" 2>"$tmp/build.err" || { echo Q1_BUILD_FAILED; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));a.equal(r.scope,"D11_Q1_PARTIAL_LAB");a.equal(r.anchors,10);a.equal(r.sourceGitBlob,"0cb5554eb1202f3f4fb84bef7d244a6ca294dda4");a.equal(r.tx2cExportsRetained,true);a.equal(r.quoteCustodyImplemented,false);a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);console.log(JSON.stringify(r));' "$tmp/build.json"
          for f in authority_c9w_tx1_d10.cjs tx2b_projection_lab.cjs test_tx2b_projection.cjs tx2b_authentic_with_projection.cjs; do cmp -s "$tmp/rebuilt/$f" "$out/$f" || { echo RC0_MATERIALIZATION_MISMATCH; exit 1; }; done
          cmp -s "$tools/test_q1.cjs" "$out/test_q1.cjs" || { echo RC0_ORACLE_MISMATCH; exit 1; }
          echo RC0_FIVE_FILES_BYTE_IDENTICAL
          for f in "$out"/*.cjs; do "$nodebin" --check "$f" >/dev/null 2>&1 || { echo Q1_SYNTAX_FAILED; exit 1; }; done
          qrc=0
          offline "$out/test_q1.cjs" "$out" "$base" >"$tmp/q1.json" 2>"$tmp/q1.err" || qrc=$?
          test -s "$tmp/q1.json" || { echo Q1_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));a.equal(r.scope,"D11_Q1_PARTIAL_LAB");a.equal(r.rows.length,9);console.log(JSON.stringify({scope:r.scope,pass:r.pass,fail:r.fail,rows:r.rows.map((x,i)=>({case:i+1,pass:x.pass,code:/^[A-Z0-9_]+$/.test(x.errorCode||"")?x.errorCode:null})),W:r.W}));a.equal(r.pass,9);a.equal(r.fail,0);a.ok(r.rows.every(x=>x.pass));a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.quoteCustodyImplemented,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/q1.json"
          test "$qrc" = 0
          prc=0
          offline "$out/test_tx2b_projection.cjs" >"$tmp/proj.json" 2>"$tmp/proj.err" || prc=$?
          test -s "$tmp/proj.json" || { echo Q1_PROJECTION_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));a.equal(r.scope,"TX2C_D11_X03_SOURCE_GATE_LAB");a.equal(r.rows.length,49);a.equal(new Set(r.rows.map(x=>x.id)).size,49);console.log(JSON.stringify({scope:r.scope,pass:r.pass,fail:r.fail,failed:r.rows.filter(x=>!x.pass).map(x=>({id:x.id,code:/^[A-Z0-9_]+$/.test(x.errorCode||"")?x.errorCode:null})),W:r.W}));a.equal(r.pass,49);a.equal(r.fail,0);a.ok(r.rows.every(x=>x.pass));a.equal(r.physicalWrites,0);a.equal(r.physicalClear,false);a.equal(r.certifiesP0,0);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/proj.json"
          test "$prc" = 0
          arc=0
          offline "$out/tx2b_authentic_with_projection.cjs" "$tmp/src" >"$tmp/auth.json" 2>"$tmp/auth.err" || arc=$?
          test -s "$tmp/auth.json" || { echo Q1_AUTHENTIC_NO_RECEIPT; exit 1; }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs");const r=JSON.parse(f.readFileSync(process.argv[1]));a.equal(r.scope,"TX2B_AUTHENTIC_BUY_PLUS_SYNTHETIC_PROJECTION_LAB");a.equal(r.parentSha256,"f0b0da6f5a7dbac4ae57ee2ecb181a5b59324edff2407fe8f4af40ea52a765ab");a.equal(r.overlaySha256,"e709a5ae4d986b960e97925f4f75625faf312f734e1ee39883d9bb0f0dc8ffe1");a.equal(r.rows.length,12);console.log(JSON.stringify({scope:r.scope,pass:r.rows.filter(x=>x.pass).length,failed:r.rows.filter(x=>!x.pass).map(x=>x.mode),W:r.W}));a.ok(r.rows.every(x=>x.pass));a.ok(r.rows.slice(0,2).every(x=>x.projected===true&&x.projectionProof===true&&x.projectionClearReady===true&&x.projectionPhysicalClear===false&&x.projectionRows===4));a.ok(r.rows.slice(2).every(x=>x.projected===false));a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.projectionCompletePhysical,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/auth.json"
          test "$arc" = 0
          echo RC0_MATERIALIZED_70_LAB_NO_W_NO_GAS_NO_DEPLOY
