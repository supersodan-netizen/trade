name: TRADE C9W FULL authentic callers VM deny
on:
  push:
    branches: ['audit/c9w-full-source-gate-only']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'supersodan-netizen/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned read-only source checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-source
      - name: Pinned read-only gate checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 6610f33a424ca5927499a9734bc532f356695fb9
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-gate
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Authentic caller VM deny integration, no network, sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          test "$(git -C private-source rev-parse HEAD:candidate/Codigo.gs)" = c7c9d96dec84a605ff0b7ed330b3330db67c5aee
          test "$(git -C private-gate rev-parse HEAD)" = 6610f33a424ca5927499a9734bc532f356695fb9
          test "$(git -C private-gate rev-parse HEAD:integration/c9w_full_vm_deny.cjs)" = f7e509790a319ca89d085250a0bd42327691a3b5
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/src" "$tmp/home"
          git -C private-source archive HEAD candidate scripts docs tests lab | tar -x -C "$tmp/src"
          test -z "$(find "$tmp/src" -type f \( -name '.clasp*' -o -name '.env*' \) -print -quit)"
          nodebin=$(command -v node)
          "$nodebin" -v
          rc=0
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH=/usr/bin:/bin HOME="$tmp/home" "$nodebin" "$PWD/private-gate/integration/c9w_full_vm_deny.cjs" "$tmp/src" >"$tmp/vm.json" 2>"$tmp/vm.err" || rc=$?
          if [ ! -s "$tmp/vm.json" ]; then
            echo C9W_VM_NO_STRUCTURED_RESULT
            exit 2
          fi
          node -e 'const a=require("node:assert/strict"),fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));a.equal(r.scope,"C9W_FULL_VM_DENY_ONLY");a.equal(r.parentSha256,"f0b0da6f5a7dbac4ae57ee2ecb181a5b59324edff2407fe8f4af40ea52a765ab");a.match(r.overlaySha256,/^[a-f0-9]{64}$/);a.equal(r.gasExecuted,false);a.equal(r.economicRealWrites,0);a.equal(r.realAuthorityConnected,false);a.equal(r.fullWriterIsolation,false);a.equal(r.allAlternativePathsEliminated,false);a.equal(r.certifiesOriginalP0,0);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");const out={scope:r.scope,overlaySha256:r.overlaySha256,authenticCallers:r.authenticCallers,legacyEntriesReplaced:r.legacyEntriesReplaced,patchedOwners:r.patchedOwners,rawMutationControl:r.rawMutationControl,typedMutationControl:r.typedMutationControl,fullGasBoot:r.fullGasBoot,rollbackByteExact:r.rollbackByteExact,fullOverlayCompiled:r.fullOverlayCompiled,rows:r.rows.map((x,i)=>({case:i+1,kind:x.kind,portCalls:x.portCalls,exactPort:x.exactPort,txBound:x.txBound,returnedFalse:x.returnedFalse,exception:x.exception,rawAttempts:x.rawAttempts,unchanged:x.unchanged,balanced:x.balanced,pass:x.pass})),economicRealWrites:0,certifiesOriginalP0:0,W:r.W};console.log(JSON.stringify(out));a.equal(r.authenticCallers,4);a.equal(r.legacyEntriesReplaced,3);a.equal(r.patchedOwners,12);a.equal(r.rawMutationControl,true);a.equal(r.typedMutationControl,true);a.equal(r.fullOverlayCompiled,true);a.equal(r.rollbackByteExact,true);a.ok(r.rows.every(x=>x.pass));' "$tmp/vm.json"
          test "$rc" = 0
          echo C9W_FULL_VM_AUTHENTIC_DENY_INTEGRATION_LOCAL_ONLY_NO_GAS_NO_W_NO_DEPLOY
