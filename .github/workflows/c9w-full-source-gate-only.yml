name: TRADE C9W TX2A authentic caller LAB handoff
on:
  push:
    branches: ['audit/c9w-full-source-gate-only']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'supersodan-netizen/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned read-only source checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-source
      - name: Pinned read-only gate checkout
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 52a9bb4ac285cdc3ad953190504d86c114e24487
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-gate
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: TX2A isolated synthetic handoff with sanitized result
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = 36ec5545a504f2a8031c4d1754d1fc36675e8f63
          test "$(git -C private-gate rev-parse HEAD)" = 52a9bb4ac285cdc3ad953190504d86c114e24487
          test "$(git -C private-gate rev-parse HEAD:integration/tx2a.cjs)" = 35fc4325b05408a3c25af42ba1bd9ec60ee8611d
          test "$(git -C private-gate rev-parse HEAD:integration/authority_c9w_tx1_lab.cjs)" = 9cc7ce911fd5a2c1aec9a901dc77ba8af8d7347b
          test "$(git -C private-gate rev-parse HEAD:integration/d9_boundary.cjs)" = ddeef2cebe7254bbd5d1cdcbd9e53479475f68ea
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/src" "$tmp/home" "$tmp/gate"
          git -C private-source archive HEAD candidate scripts docs tests lab | tar -x -C "$tmp/src"
          git -C private-gate archive HEAD integration | tar -x -C "$tmp/gate"
          test -z "$(find "$tmp/src" "$tmp/gate" -type f \( -name '.clasp*' -o -name '.env*' \) -print -quit)"
          nodebin=$(command -v node)
          "$nodebin" -v
          rc=0
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH=/usr/bin:/bin HOME="$tmp/home" "$nodebin" "$tmp/gate/integration/tx2a.cjs" "$tmp/src" >"$tmp/r.json" 2>"$tmp/e" || rc=$?
          if [ ! -s "$tmp/r.json" ]; then
            echo TX2A_NO_STRUCTURED_RESULT
            node -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");const e=s.split("\n").find(x=>/^(Error|TypeError|ReferenceError|SyntaxError|AssertionError|GuardError):/.test(x));const safe={kind:e?.split(":")[0]||"UNKNOWN",known:(e?.match(/^[A-Za-z]+: ((?:TX1_|D9_|C9M_|C8[A-Z]_|C8Z_|ORDER_|C9W_|C5W_|SQLITE_)[A-Z0-9_]+)$/)||[])[1]||null,frames:[...s.matchAll(/(?:tx2a|authority_c9w_tx1_lab|d9_boundary)\.cjs:(\d+):(\d+)/g)].slice(0,6).map(m=>[+m[1],+m[2]]),sourceBodyMissing:/FUNCTION_NOT_FOUND|SOURCE_OWNER_NOT_FOUND|function not found|no encontrada|funcion no encontrada/i.test(s),syntax:/SyntaxError/.test(s)};console.log(JSON.stringify(safe));' "$tmp/e"
            exit 2
          fi
          node -e 'const a=require("node:assert/strict"), fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));a.equal(r.scope,"TX2A_LAB_AUTHENTIC_BUY_HANDOFF");a.equal(r.parentSha256,"f0b0da6f5a7dbac4ae57ee2ecb181a5b59324edff2407fe8f4af40ea52a765ab");a.match(r.overlaySha256,/^[a-f0-9]{64}$/);a.equal(r.physicalWrites,0);a.equal(r.projectionComplete,false);a.equal(r.fullGasBoot,false);a.equal(r.certifiesP0,0);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");const fields=["returnedFalse","exception","raw","port","prepare","commit","readbacks","queueReads","balanced","cashCents","feesCents","positions","plan","reserve","claim","commits","bookOK","opsUnchanged","pass"];const allowed=["GOOD","RETRY","UNDERPRICE","FEE_DRIFT","QUEUE_WRONG","QUEUE_STALE","READBACK_DRIFT","BAD_PRICE_SIGNATURE","SELL","IDS_WRONG"];const rs=r.rows.map(x=>({case:allowed.indexOf(x.mode)+1,...Object.fromEntries(fields.map(k=>{a.ok(["number","boolean"].includes(typeof x[k]));return [k,x[k]]})),reasonClass:x.reason.split("|").map(y=>["RECOVERY","EVIDENCE_MISMATCH","ALREADY_COMMITTED_NO_REPLAY","COMMITTED_PROJECTION_PENDING","RAW_WRITE_FORBIDDEN"].includes(y)?y:y.endsWith("is not defined")?"MISSING_DEPENDENCY":y?"OTHER":"EMPTY")}));console.log(JSON.stringify({scope:r.scope,overlaySha256:r.overlaySha256,authenticHelperCount:r.authenticHelperCount,rows:rs,physicalWrites:0,certifiesP0:0}));a.equal(rs.length,10);a.ok(rs.every(x=>x.pass));' "$tmp/r.json"
          test "$rc" = 0
          echo TX2A_SYNTHETIC_BUY_HANDOFF_LAB_ONLY_NO_GAS_NO_W_NO_DEPLOY
