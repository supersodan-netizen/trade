name: TRADE G4a close fold LAB only
on:
  push:
    branches: ['audit/c9w-full-source-gate-only']
    paths: ['.github/workflows/c9w-g4a-close-fold-only.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'supersodan-netizen/trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Pinned accepted source read-only
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: f7a0c17a6979c4cedcb5f077fb331e991e56941e
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-source
      - name: Pinned fold candidate read-only
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: 06d7001d204d66fd251eca0388a8fd38cc6ea6e3
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-lab
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Offline independent accounting fold, no native write endpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = f7a0c17a6979c4cedcb5f077fb331e991e56941e
          test "$(git -C private-lab rev-parse HEAD)" = 06d7001d204d66fd251eca0388a8fd38cc6ea6e3
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/authority_c9w_tx1_d10.cjs)" = 3d86c7f887513ea4b4afa8cc77c4799d3cc4079a
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/tx2b_projection_lab.cjs)" = feac050c4690346ecc4cf062a85555ad5537be3f
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_stop_close_fold_lab.cjs)" = 235b5967fb6ea6abea72bac57a10041ed7dfc3bd
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_g4a_stop_close_fold_lab.cjs)" = 2e74627e20ff069d352c41cd3a32ed87c4ad2584
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/src" "$tmp/lab" "$tmp/home"
          git -C private-source archive HEAD candidate scripts docs tests lab | tar -x -C "$tmp/src"
          git -C private-lab archive HEAD lab/trade-integrated-baseline | tar -x -C "$tmp/lab"
          test -z "$(find "$tmp/src" "$tmp/lab" -type f \( -name '.clasp*' -o -name '.env*' -o -name '*.pem' \) -print -quit)"
          nodebin=$(command -v node)
          offline() {
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH="$(dirname "$nodebin"):/usr/bin:/bin" HOME="$tmp/home" NODE_NO_WARNINGS=1 "$nodebin" "$@"
          }
          rc=0
          offline "$tmp/lab/lab/trade-integrated-baseline/test_g4a_stop_close_fold_lab.cjs" "$tmp/src" "$tmp/result.json" >"$tmp/stdout" 2>"$tmp/stderr" || rc=$?
          test -s "$tmp/result.json" || { echo G4A_FOLD_NO_RECEIPT; exit 1; }
          offline -e 'const fs=require("node:fs"),a=require("node:assert/strict");const r=JSON.parse(fs.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:r.scope,total:r.total,pass:r.pass,failed:r.rows.filter(x=>!x.pass).map(x=>({id:x.id,error:x.error||null})),W:r.W}));a.equal(r.total,12);a.equal(r.pass,12);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0)' "$tmp/result.json"
          test "$rc" = 0
          echo G4A_FOLD_12_ONLY_LAB_NO_W_NO_GAS_NO_DEPLOY
