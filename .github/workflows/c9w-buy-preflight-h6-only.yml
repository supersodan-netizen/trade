          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/src" "$tmp/gate" "$tmp/home"
          git -C private-source archive HEAD candidate scripts docs tests lab | tar -x -C "$tmp/src"
          git -C private-lab archive HEAD lab/c9w-full-d11-x03 lab/c9w-full-d11-strict-q1 lab/trade-integrated-baseline | tar -x -C "$tmp/gate"
          test -z "$(find "$tmp/src" "$tmp/gate" -type f \( -name '.clasp*' -o -name '.env*' -o -name '*.pem' \) -print -quit)"
          nodebin=$(command -v node)
          out="$tmp/gate/lab/trade-integrated-baseline"
          offline() {
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups env -i PATH=/usr/bin:/bin HOME="$tmp/home" "$nodebin" "$@"
          }
          test "$(sha256sum "$out/authority_c9w_tx1_d10.cjs" | cut -d' ' -f1)" = dc71bac82dd7719ba8fdf55adb946c53773042c9807544859c0acbd5af7cd966
          test "$(sha256sum "$out/tx2b_projection_lab.cjs" | cut -d' ' -f1)" = 4bbbdfd75c5a9dac5852ee81b939e9e8aa963ea95419fe71dcaa3a8333384179
          for f in "$out"/*.cjs; do offline --check "$f" >/dev/null 2>&1 || { echo "D15_H6_SYNTAX_FAILED $(basename "$f")"; exit 1; }; done
          offline "$out/operational_buy_preflight_h6_source.cjs" "$tmp/src" "$tmp/parent.gs" "$tmp/h6.gs" >"$tmp/build.json" 2>"$tmp/build.err" || {
            echo D15_H6_BUILD_FAILED
            "$nodebin" -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");console.log(JSON.stringify({diagnostic:"D15_H6_BUILD_FAILED",safe:[...new Set(s.match(/(?:D15_H6_[A-Z0-9_]+|ERR_ASSERTION|SyntaxError|ReferenceError|TypeError|MODULE_NOT_FOUND)/g)||[])],frames:[...new Set([...s.matchAll(/(?:operational_buy_preflight_h6_source|73x39j-c18-p0c5w-source-compatibility-local)\.cjs:\d+:\d+/g)].map(x=>x[0]))]}));' "$tmp/build.err"
            exit 1
          }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs"),r=JSON.parse(f.readFileSync(process.argv[1]));console.log(JSON.stringify({scope:"D15_H6_BUILD_LAB",manifest:r}));a.equal(r.parentSourceSha256,"12217cdbbe5b50dcb2b4085505ab34745f2b540fc2efb2b1ef77f6d90ee060b6");a.deepEqual(r.changedOwners,["ejecutarAprobadas","_c8eBuyConfigGate"]);a.equal(r.newOwners.length,11);a.equal(r.rollbackByteExact,true);a.equal(r.physicalWrites,0);a.equal(r.certifiesP0,0);a.equal(r.transportInstalled,false);a.equal(r.deployable,false);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/build.json"
          h=0
          offline "$out/test_operational_buy_preflight_h6.cjs" "$tmp/parent.gs" original "$tmp/parent.json" >"$tmp/parent.out" 2>"$tmp/parent.err" || h=$?
          test "$h" = 0
          h=0
          offline "$out/test_operational_buy_preflight_h6.cjs" "$tmp/h6.gs" parcheado "$tmp/h6.json" >"$tmp/h6.out" 2>"$tmp/h6.err" || h=$?
          test -s "$tmp/h6.json" || {
            echo D15_H6_NO_RECEIPT
            "$nodebin" -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");console.log(JSON.stringify({diagnostic:"D15_H6_SETUP_FAILED",safe:[...new Set(s.match(/(?:D15_H6_[A-Z0-9_]+|ERR_ASSERTION|SyntaxError|ReferenceError|TypeError|MODULE_NOT_FOUND)/g)||[])],frames:[...new Set([...s.matchAll(/(?:test_operational_buy_preflight_h6|d15_gas_effects_fixture)\.cjs:\d+:\d+/g)].map(x=>x[0]))]}));' "$tmp/h6.err"
            exit 1
          }
          "$nodebin" -e 'const a=require("node:assert/strict"),f=require("node:fs"),read=p=>JSON.parse(f.readFileSync(p)),p=read(process.argv[1]),r=read(process.argv[2]),m=read(process.argv[3]),happy=r.escenarios.filter(x=>x.alcanzaPuerto),same=happy.map(x=>({id:x.id,pass:JSON.stringify(x.args)===JSON.stringify(p.escenarios.find(y=>y.id===x.id)?.args)}));console.log(JSON.stringify({scope:r.scope,sourceSha256:r.fuenteSha256,properties:r.propiedades,pass:r.pass,scenarios:r.escenarios.map(x=>({id:x.id,port:x.alcanzaPuerto,beforeLock:x.antesDelLock.length,beforePort:x.antesDelPuertoNoAlerta.length,exception:x.resultado.startsWith("EXCEPCION:")})),units:r.unidades.map(x=>({id:x.id,pass:x.pass})),integration:r.integracion,argumentParity:same,parentNegative:{P1:p.propiedades.P1_SIN_EFECTOS_ANTES_DEL_LOCK,P2:p.propiedades.P2_ANTES_DEL_PUERTO_SOLO_LOCK_O_ALERTA_FALLO_CERRADO,missingConfig:p.escenarios.find(x=>x.id==="S03_CONFIG_AUSENTE").alcanzaPuerto,missingUniverse:p.escenarios.find(x=>x.id==="S17_UNIVERSO_AUSENTE").alcanzaPuerto},W:r.W}));a.equal(r.scope,"D15_H6_EFECTOS_PREVIOS_PUERTO_BUY_LAB");a.equal(r.fuenteSha256,m.fullSourceSha256);a.equal(p.fuenteSha256,m.parentSourceSha256);a.equal(r.escenarios.length,21);a.equal(r.unidades.length,20);a.equal(r.integracion.length,2);a.equal(happy.length,6);a.ok(same.every(x=>x.pass));a.equal(p.propiedades.P1_SIN_EFECTOS_ANTES_DEL_LOCK,false);a.equal(p.propiedades.P2_ANTES_DEL_PUERTO_SOLO_LOCK_O_ALERTA_FALLO_CERRADO,false);a.equal(p.escenarios.find(x=>x.id==="S03_CONFIG_AUSENTE").alcanzaPuerto,true);a.equal(p.escenarios.find(x=>x.id==="S17_UNIVERSO_AUSENTE").alcanzaPuerto,true);a.equal(r.pass,true);a.ok(Object.values(r.propiedades).every(x=>x===true));a.ok(r.unidades.every(x=>x.pass));a.ok(r.integracion.every(x=>x.pass));a.equal(r.physicalWrites,0);a.equal(r.W,"HOLD_EXTERNAL_EVIDENCE");' "$tmp/parent.json" "$tmp/h6.json" "$tmp/build.json"
          test "$h" = 0
          echo D15_H6_21_SCENARIOS_20_UNITS_2_AUTHENTIC_BUY_6_ARGUMENT_PARITY_LAB_NO_W_NO_GAS_NO_DEPLOY
