          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_cash.cjs)" = c2f7b1efc1ecff7d4b3cafabb9a77081a249f9f3
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_reconciliation_source.cjs)" = 5279c2f2ba0ec4d52c25f401b1206a817c57e50e
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_reconciliation.cjs)" = 7de01239271c6c0678583fa69df599965bc20db7
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_receipt_source.cjs)" = 2f93b803cc0c0125e4b1960a3e39a8a812a7c3a6
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_receipt.cjs)" = faf8214a82ca5d64b773864c816ad26b4dc87590
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_recovery_callers_source.cjs)" = 5b9182ab7eb88389a89ff2d1b585f2b523ead200
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_recovery_callers.cjs)" = 2936db8ee1c7760298d80afaaf3f887b2739eace
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_d14_stop_gate.cjs)" = 12ff993f6251a62203956eb62a911139f1dfd038
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_stop_op3c_source.cjs)" = 4e4fcffb3fdf27064b3c85b487134b4526fb6b40
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_d14_op3c_trail.cjs)" = 90eddf3f7d028eefd14d245afc04e343288af5e4
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_queue_source.cjs)" = c10a8c778906e4d13fb88234b22900e83cfff677
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_queue.cjs)" = 37faf302dff90d1278089df2271ecf39757791f2
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_queue_projection_source.cjs)" = 6adb2489214c4979997d480ab7dda5143546dbe2
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_queue_projection.cjs)" = 0720bf2906e1b04e59e7ca47ac8661463e99d4ba
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_d15_h5_ready.cjs)" = b3f5b73eb732d2f2002a8c1fcefb108484bfd7c9
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_queue_adversarial.cjs)" = 8286fa01a7f96e62788bc883b26979d3ccb2bac9
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/operational_buy_preflight_h6_source.cjs)" = 455b25a0132e70bd73132e74aa949aca11c5b912
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/d15_gas_effects_fixture.cjs)" = a0dc15eed353e3a803e3d2fa8ee007ea39ea3cd6
