          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_d12_t9.cjs)" = eb196904a8d1e38e5131a10cf94fd39c6e87baf3
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_recovery.cjs)" = d8a76904d8b73202663847da7468e8c75bf6d5ce
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_stop.cjs)" = 96d4b6b2197370ecdb8904a705c8889c2e6a3c07
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_operational_stop_admission.cjs)" = 28d496cf75a06fd79814735ac4ae43e5b6d8b303
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_pb_stop.cjs)" = 3d5291877e97099568757d07dab6e59caede1730
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_q1.cjs)" = e86bf304ef0f94f222b0e0f42370a32cc2d7b700
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_q2.cjs)" = e2ac7b1ceb233ffbc9ee1c69f7dba2f0a92a727e
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_recovery_scan.cjs)" = 0597c0571143e694293722776a6abd4da874990c
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_rs2c3_mutants.cjs)" = f7a7e0b08afe82ff2f13c0804a12637235177cb0
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/test_tx2b_projection.cjs)" = 4b4118d7b726d6adca83ced3770be594205d45d6
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/tx2b_authentic_with_projection.cjs)" = aa1644aaf9dbbdf579b4bca51d61a1c63320bc6c
          test "$(git -C private-lab rev-parse HEAD:lab/trade-integrated-baseline/tx2b_projection_lab.cjs)" = 7f0458c8c54b157bc41b0f4d579d5a4d020e5f71
