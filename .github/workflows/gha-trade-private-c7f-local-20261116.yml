name: TRADE private audit - public runner C7F local only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gha-trade-private-c7f-local-20261116.yml
  schedule:
    - cron: '23 */2 * * *'
permissions:
  contents: read
concurrency:
  group: trade-private-c7f-local-only
  cancel-in-progress: true
jobs:
  local-c7f:
    if: github.repository == 'supersodan-netizen/trade' && (github.event_name != 'workflow_dispatch' || github.actor == 'supersodan-netizen')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify read-only private credential configured
        env:
          READ_KEY: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
        run: |
          if [ -z "${READ_KEY:-}" ]; then
            echo HOLD_PRIVATE_READ_KEY_NOT_CONFIGURED
            exit 2
          fi
      - name: Checkout public CI wrapper without persisted credentials
        uses: actions/checkout@v5
        with:
          path: public-runner
          persist-credentials: false
      - name: Checkout private TRADE source, only audit branch and latest commit
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: audit/73x39j-c18-canonical-executor
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-trade
      - name: Set up Node 22 for frozen C7F local regression
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Execute C7F local test workflow with public logs suppressed
        run: node public-runner/scripts/run-c7f-private-local-only.mjs private-trade
      - name: C7O offline diff plan only, fail closed and NO GAS deployment
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7o-paper-diff-plan-only.cjs
          node scripts/73x39j-c18-p0c7o-paper-diff-plan-only.cjs --self-test
          trap 'rm -f c7o-plan-ci.log' EXIT
          node scripts/73x39j-c18-p0c7o-paper-diff-plan-only.cjs --plan-only > c7o-plan-ci.log
          grep -Fx 'TRADE_C7O_DIFF_PLAN_ONLY_PASS_HOLD_NO_GAS_NO_DEPLOY' c7o-plan-ci.log
      - name: C7P private-only bundle inventory and dependency collisions, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7p-bundle-inventory-local.cjs
          node scripts/73x39j-c18-p0c7p-bundle-inventory-local.cjs --self-test
          trap 'rm -f c7p-private-manifest-ci.log' EXIT
          node scripts/73x39j-c18-p0c7p-bundle-inventory-local.cjs --plan-only > c7p-private-manifest-ci.log
          grep -Fx 'TRADE_C7P_PRIVATE_BUNDLE_INVENTORY_PASS_HOLD_INCOMPLETE_EXECUTOR_NO_GAS_NO_DEPLOY' c7p-private-manifest-ci.log
      - name: C7Q reconcile LAB runtime owners, reject commit fork and incomplete closure
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7q-runtime-reconcile-local.cjs
          node scripts/73x39j-c18-p0c7q-runtime-reconcile-local.cjs --self-test
          trap 'rm -f c7q-reconcile-ci.log' EXIT
          node scripts/73x39j-c18-p0c7q-runtime-reconcile-local.cjs --plan-only > c7q-reconcile-ci.log
          grep -Fx 'TRADE_C7Q_OWNER_RECONCILIATION_PASS_HOLD_COMMIT_FORK_NO_GAS_NO_DEPLOY' c7q-reconcile-ci.log
      - name: C7R reversible LAB-only C5Y C6W commit seam and fail-closed negative checks
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7r-commit-seam-local.cjs
          node scripts/73x39j-c18-p0c7r-commit-seam-local.cjs --self-test
          trap 'rm -f c7r-private-seam-ci.log' EXIT
          node scripts/73x39j-c18-p0c7r-commit-seam-local.cjs --plan-only > c7r-private-seam-ci.log
          grep -Fx 'TRADE_C7R_REVERSIBLE_SINGLE_COMMIT_SOURCE_PLAN_PASS_HOLD_GAS_NO_DEPLOY' c7r-private-seam-ci.log
      - name: C7S integrated V8 mock financial journal and recovery cuts, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7s-integrated-replay-vm-local.cjs
          node scripts/73x39j-c18-p0c7s-integrated-replay-vm-local.cjs --self-test
          trap 'rm -f c7s-private-mock-ci.log' EXIT
          node scripts/73x39j-c18-p0c7s-integrated-replay-vm-local.cjs --plan-only > c7s-private-mock-ci.log
          grep -Fx 'TRADE_C7S_INTEGRATED_MOCK_VM_PASS_HOLD_PHYSICAL_NO_GAS_NO_DEPLOY' c7s-private-mock-ci.log

      - name: C7T helper source guards and extended LAB fault/replay VM, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7t-helper-fault-replay-local.cjs
          node scripts/73x39j-c18-p0c7t-helper-fault-replay-local.cjs --self-test
          trap 'rm -f c7t-private-fault-ci.log' EXIT
          node scripts/73x39j-c18-p0c7t-helper-fault-replay-local.cjs --plan-only > c7t-private-fault-ci.log
          grep -Fx 'TRADE_C7T_HELPER_AND_FAULT_MATRIX_PASS_HOLD_NO_GAS_NO_DEPLOY' c7t-private-fault-ci.log
