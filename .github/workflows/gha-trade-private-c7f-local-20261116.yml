name: TRADE private audit - public runner C7F local only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gha-trade-private-c7f-local-20261116.yml
  schedule:
    - cron: '23 */2 * * *'
permissions:
  contents: read
concurrency:
  group: trade-private-c7f-local-only
  cancel-in-progress: true
jobs:
  local-c7f:
    if: github.repository == 'supersodan-netizen/trade' && (github.event_name != 'workflow_dispatch' || github.actor == 'supersodan-netizen')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify read-only private credential configured
        env:
          READ_KEY: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
        run: |
          if [ -z "${READ_KEY:-}" ]; then
            echo HOLD_PRIVATE_READ_KEY_NOT_CONFIGURED
            exit 2
          fi
      - name: Checkout public CI wrapper without persisted credentials
        uses: actions/checkout@v5
        with:
          path: public-runner
          persist-credentials: false
      - name: Checkout private TRADE source, only audit branch and latest commit
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: audit/73x39j-c18-canonical-executor
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-trade
      - name: Set up Node 22 for frozen C7F local regression
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Execute C7F local test workflow with public logs suppressed
        run: node public-runner/scripts/run-c7f-private-local-only.mjs private-trade
      - name: C7O offline diff plan only, fail closed and NO GAS deployment
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7o-paper-diff-plan-only.cjs
          node scripts/73x39j-c18-p0c7o-paper-diff-plan-only.cjs --self-test
          trap 'rm -f c7o-plan-ci.log' EXIT
          node scripts/73x39j-c18-p0c7o-paper-diff-plan-only.cjs --plan-only > c7o-plan-ci.log
          grep -Fx 'TRADE_C7O_DIFF_PLAN_ONLY_PASS_HOLD_NO_GAS_NO_DEPLOY' c7o-plan-ci.log
      - name: C7P private-only bundle inventory and dependency collisions, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7p-bundle-inventory-local.cjs
          node scripts/73x39j-c18-p0c7p-bundle-inventory-local.cjs --self-test
          trap 'rm -f c7p-private-manifest-ci.log' EXIT
          node scripts/73x39j-c18-p0c7p-bundle-inventory-local.cjs --plan-only > c7p-private-manifest-ci.log
          grep -Fx 'TRADE_C7P_PRIVATE_BUNDLE_INVENTORY_PASS_HOLD_INCOMPLETE_EXECUTOR_NO_GAS_NO_DEPLOY' c7p-private-manifest-ci.log
      - name: C7Q reconcile LAB runtime owners, reject commit fork and incomplete closure
