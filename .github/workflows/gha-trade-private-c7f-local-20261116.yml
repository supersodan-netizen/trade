        env:
          READ_KEY: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
        run: |
          if [ -z "${READ_KEY:-}" ]; then
            echo HOLD_PRIVATE_READ_KEY_NOT_CONFIGURED
            exit 2
          fi
      - name: Checkout public CI wrapper without persisted credentials
        uses: actions/checkout@v5
        with:
          path: public-runner
          persist-credentials: false
      - name: Checkout private TRADE source, only audit branch and latest commit
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: audit/73x39j-c18-canonical-executor
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-trade
      - name: Set up Node 22 for frozen C7F local regression
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: C9B actual metadata provenance and late CAS race reproduction, MOCK ONLY
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c9b-physical-admin-evidence-and-properties-cas-race-local.cjs
          node scripts/73x39j-c18-p0c9b-physical-admin-evidence-and-properties-cas-race-local.cjs --self-test
