name: TRADE private audit - public runner C7F local only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gha-trade-private-c7f-local-20261116.yml
  schedule:
    - cron: '23 */2 * * *'
permissions:
  contents: read
concurrency:
  group: trade-private-c7f-local-only
  cancel-in-progress: true
jobs:
  local-c7f:
    if: github.repository == 'supersodan-netizen/trade' && (github.event_name != 'workflow_dispatch' || github.actor == 'supersodan-netizen')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify read-only private credential configured
        env:
          READ_KEY: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
        run: |
          if [ -z "${READ_KEY:-}" ]; then
            echo HOLD_PRIVATE_READ_KEY_NOT_CONFIGURED
            exit 2
          fi
      - name: Checkout public CI wrapper without persisted credentials
        uses: actions/checkout@v5
        with:
          path: public-runner
          persist-credentials: false
      - name: Checkout private TRADE source, only audit branch and latest commit
        uses: actions/checkout@v5
        with:
          repository: supersodan-netizen/trade-staging
          ref: audit/73x39j-c18-canonical-executor
          ssh-key: ${{ secrets.TRADE_STAGING_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          path: private-trade
      - name: Set up Node 22 for frozen C7F local regression
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Execute C7F local test workflow with public logs suppressed
        run: node public-runner/scripts/run-c7f-private-local-only.mjs private-trade
      - name: C7O offline diff plan only, fail closed and NO GAS deployment
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7o-paper-diff-plan-only.cjs
          node scripts/73x39j-c18-p0c7o-paper-diff-plan-only.cjs --self-test
          trap 'rm -f c7o-plan-ci.log' EXIT
          node scripts/73x39j-c18-p0c7o-paper-diff-plan-only.cjs --plan-only > c7o-plan-ci.log
          grep -Fx 'TRADE_C7O_DIFF_PLAN_ONLY_PASS_HOLD_NO_GAS_NO_DEPLOY' c7o-plan-ci.log
      - name: C7P private-only bundle inventory and dependency collisions, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7p-bundle-inventory-local.cjs
          node scripts/73x39j-c18-p0c7p-bundle-inventory-local.cjs --self-test
          trap 'rm -f c7p-private-manifest-ci.log' EXIT
          node scripts/73x39j-c18-p0c7p-bundle-inventory-local.cjs --plan-only > c7p-private-manifest-ci.log
          grep -Fx 'TRADE_C7P_PRIVATE_BUNDLE_INVENTORY_PASS_HOLD_INCOMPLETE_EXECUTOR_NO_GAS_NO_DEPLOY' c7p-private-manifest-ci.log
      - name: C7Q reconcile LAB runtime owners, reject commit fork and incomplete closure
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7q-runtime-reconcile-local.cjs
          node scripts/73x39j-c18-p0c7q-runtime-reconcile-local.cjs --self-test
          trap 'rm -f c7q-reconcile-ci.log' EXIT
          node scripts/73x39j-c18-p0c7q-runtime-reconcile-local.cjs --plan-only > c7q-reconcile-ci.log
          grep -Fx 'TRADE_C7Q_OWNER_RECONCILIATION_PASS_HOLD_COMMIT_FORK_NO_GAS_NO_DEPLOY' c7q-reconcile-ci.log
      - name: C7R reversible LAB-only C5Y C6W commit seam and fail-closed negative checks
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7r-commit-seam-local.cjs
          node scripts/73x39j-c18-p0c7r-commit-seam-local.cjs --self-test
          trap 'rm -f c7r-private-seam-ci.log' EXIT
          node scripts/73x39j-c18-p0c7r-commit-seam-local.cjs --plan-only > c7r-private-seam-ci.log
          grep -Fx 'TRADE_C7R_REVERSIBLE_SINGLE_COMMIT_SOURCE_PLAN_PASS_HOLD_GAS_NO_DEPLOY' c7r-private-seam-ci.log
      - name: C7S integrated V8 mock financial journal and recovery cuts, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7s-integrated-replay-vm-local.cjs
          node scripts/73x39j-c18-p0c7s-integrated-replay-vm-local.cjs --self-test
          trap 'rm -f c7s-private-mock-ci.log' EXIT
          node scripts/73x39j-c18-p0c7s-integrated-replay-vm-local.cjs --plan-only > c7s-private-mock-ci.log
          grep -Fx 'TRADE_C7S_INTEGRATED_MOCK_VM_PASS_HOLD_PHYSICAL_NO_GAS_NO_DEPLOY' c7s-private-mock-ci.log

      - name: C7T helper source guards and extended LAB fault/replay VM, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7t-helper-fault-replay-local.cjs
          node scripts/73x39j-c18-p0c7t-helper-fault-replay-local.cjs --self-test
          trap 'rm -f c7t-private-fault-ci.log' EXIT
          node scripts/73x39j-c18-p0c7t-helper-fault-replay-local.cjs --plan-only > c7t-private-fault-ci.log
          grep -Fx 'TRADE_C7T_HELPER_AND_FAULT_MATRIX_PASS_HOLD_NO_GAS_NO_DEPLOY' c7t-private-fault-ci.log

      - name: C7U execute frozen CORE helper bodies with in-memory fake GAS services, NO DEPLOY
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7u-authentic-helper-vm-local.cjs
          node scripts/73x39j-c18-p0c7u-authentic-helper-vm-local.cjs --self-test
          trap 'rm -f c7u-helper-fixture-ci.log' EXIT
          node scripts/73x39j-c18-p0c7u-authentic-helper-vm-local.cjs --plan-only > c7u-helper-fixture-ci.log
          grep -Fx 'TRADE_C7U_REAL_HELPERS_VM_PASS_HOLD_PHYSICAL_NO_GAS_NO_DEPLOY' c7u-helper-fixture-ci.log

      - name: C7V read-only ledger-anchor and journal-clear triage using authentic CORE helper VM, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7v-ledger-clear-readonly-triage-local.cjs
          node scripts/73x39j-c18-p0c7v-ledger-clear-readonly-triage-local.cjs --self-test
          trap 'rm -f c7v-triage-ci.log' EXIT
          node scripts/73x39j-c18-p0c7v-ledger-clear-readonly-triage-local.cjs --plan-only > c7v-triage-ci.log
          grep -Fx 'TRADE_C7V_HOLD_ONLY_REPAIR_DECISION_MATRIX_PASS_NO_GAS_NO_DEPLOY' c7v-triage-ci.log

      - name: C7W authenticate original callers and exception propagation in isolated V8 only
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7w-authentic-caller-exception-vm-local.cjs
          node scripts/73x39j-c18-p0c7w-authentic-caller-exception-vm-local.cjs --self-test
          trap 'rm -f c7w-caller-private-ci.log' EXIT
          node scripts/73x39j-c18-p0c7w-authentic-caller-exception-vm-local.cjs --plan-only > c7w-caller-private-ci.log
          grep -Fx 'TRADE_C7W_RECOVERY_HAZARDS_REQUIRE_SIGNED_PHYSICAL_FORENSICS_HOLD_NO_GAS_NO_DEPLOY' c7w-caller-private-ci.log

      - name: C7X isolated reversible fail-closed overlay against authentic callers, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7x-failclosed-caller-overlay-lab.cjs
          node scripts/73x39j-c18-p0c7x-failclosed-caller-overlay-lab.cjs --self-test
          trap 'rm -f c7x-inmemory-overlay-ci.log' EXIT
          node scripts/73x39j-c18-p0c7x-failclosed-caller-overlay-lab.cjs --plan-only > c7x-inmemory-overlay-ci.log
          grep -Fx 'TRADE_C7X_HOLD_PHYSICAL_PATCH_ONLY_IN_MEMORY_NO_CREDENTIALS_NO_DEPLOY' c7x-inmemory-overlay-ci.log

      - name: C7Y adversarial alert durability, replay and outside-lock writer races, VM ONLY
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7y-alert-durability-writer-races-lab.cjs
          node scripts/73x39j-c18-p0c7y-alert-durability-writer-races-lab.cjs --self-test
          trap 'rm -f c7y-adversarial-private-ci.log' EXIT
          node scripts/73x39j-c18-p0c7y-alert-durability-writer-races-lab.cjs --plan-only > c7y-adversarial-private-ci.log
          grep -Fx 'TRADE_C7Y_EXTERNAL_EVIDENCE_REQUIRED_P0_OPEN_HOLD_NO_GAS_NO_DEPLOY' c7y-adversarial-private-ci.log

      - name: C7Z audit release acceptance gates and 12 independent evidence blockers, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c7z-audit-release-gates-evidence-inventory-local.cjs
          node scripts/73x39j-c18-p0c7z-audit-release-gates-evidence-inventory-local.cjs --self-test
          trap 'rm -f c7z-audit-hold-private-ci.log' EXIT
          node scripts/73x39j-c18-p0c7z-audit-release-gates-evidence-inventory-local.cjs --plan-only > c7z-audit-hold-private-ci.log
          grep -Fx 'TRADE_C7Z_G0_G5_AND_EXTERNAL_EVIDENCE_HOLD_CLOSED_LAB_ONLY_NO_DEPLOY' c7z-audit-hold-private-ci.log

      - name: C8A assemble full review source, seven anchored patches and real caller fault tests, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c8a-full-rc-review-builder-local.cjs
          node scripts/73x39j-c18-p0c8a-full-rc-review-builder-local.cjs --self-test
          trap 'rm -f c8a-private-review-manifest.log' EXIT
          node scripts/73x39j-c18-p0c8a-full-rc-review-builder-local.cjs --plan-only > c8a-private-review-manifest.log
          grep -Fx 'TRADE_C8A_RC_REVIEW_ONLY_P0_OPEN_HOLD_NO_GAS_NO_DEPLOY' c8a-private-review-manifest.log

      - name: C8B same full RC stop priority and queue uncertainty anchored source tests ONLY, NO GAS
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c8b-queue-stop-source-rc-lab.cjs
          node scripts/73x39j-c18-p0c8b-queue-stop-source-rc-lab.cjs --self-test
          trap 'rm -f c8b-private-only-plan.log' EXIT
          node scripts/73x39j-c18-p0c8b-queue-stop-source-rc-lab.cjs --plan-only > c8b-private-only-plan.log
          grep -Fx 'TRADE_C8B_HOLD_19_P0_PENDING_INDEPENDENT_REVIEW_NO_GAS_NO_DEPLOY' c8b-private-only-plan.log

      - name: C8C full RC genuine reservation/watcher/prejournal function tests with mocks ONLY
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c8c-reservation-watcher-prejournal-full-rc-lab.cjs
          node scripts/73x39j-c18-p0c8c-reservation-watcher-prejournal-full-rc-lab.cjs --self-test
          trap 'rm -f c8c-plan-private-ci.log' EXIT
          node scripts/73x39j-c18-p0c8c-reservation-watcher-prejournal-full-rc-lab.cjs --plan-only > c8c-plan-private-ci.log
          grep -Fx 'TRADE_C8C_19_P0_PENDING_HOLD_NO_GAS_NO_DEPLOY' c8c-plan-private-ci.log
          grep -F '15ee4f815ceff13cd9264437ff6a56038b518dd336b36c2451da1b7c7378f81c' c8c-plan-private-ci.log >/dev/null

      - name: C8D anchored real R2-04 config and E2-08 reset false-green guards on full RC MOCK only
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c8d-config-reset-failclosed-full-rc-lab.cjs
          node scripts/73x39j-c18-p0c8d-config-reset-failclosed-full-rc-lab.cjs --self-test
          trap 'rm -f c8d-private-plan-ci.log' EXIT
          node scripts/73x39j-c18-p0c8d-config-reset-failclosed-full-rc-lab.cjs --plan-only > c8d-private-plan-ci.log
          grep -Fx 'TRADE_C8D_19_P0_PENDING_HOLD_NO_GAS_NO_DEPLOY' c8d-private-plan-ci.log
          grep -F 'f1e58f2cf3318ee656e23634ad9bc9a73a2a6e93b1c6362d74d41b32ebdad005' c8d-private-plan-ci.log >/dev/null

      - name: C8E defensive stop liveness and BUY admission separation on same full RC MOCK only
        run: |
          set -euo pipefail
          cd private-trade
          node --check scripts/73x39j-c18-p0c8e-stop-liveness-buy-separation-full-rc-lab.cjs
          node scripts/73x39j-c18-p0c8e-stop-liveness-buy-separation-full-rc-lab.cjs --self-test
          trap 'rm -f c8e-private-ci-plan.log' EXIT
          node scripts/73x39j-c18-p0c8e-stop-liveness-buy-separation-full-rc-lab.cjs --plan-only > c8e-private-ci-plan.log
          grep -Fx 'TRADE_C8E_19_P0_PENDING_HOLD_NO_GAS_NO_DEPLOY' c8e-private-ci-plan.log
