          grep -F '"firstAlertPreservationUnderConcurrentExternalWriter":false' c9b-public-safety-plan.json >/dev/null
          grep -F '"protectedContentHashesCertified":0' c9b-public-safety-plan.json >/dev/null
          grep -F '"sevenWriterClassesCertified":0' c9b-public-safety-plan.json >/dev/null
